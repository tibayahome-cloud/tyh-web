name: Frontend CI

on:
  # Every pull request, whatever it targets. Filtering by base branch meant a PR stacked on
  # another feature branch ran only the Vercel deployment check -- so the tests and the build
  # never ran, and the PR still showed a full row of green ticks.
  pull_request:
  push:
    branches:
      - dev
      - main
      - master

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A worktree's node_modules is a symlink, and the old `node_modules/` ignore rule does not
      # match a symlink, so one was committed by accident (70f7cc9). Fail fast if any symlink or
      # dependency/worktree folder is tracked.
      - name: Reject tracked symlinks and dependency folders
        run: |
          bad=$( { git ls-files -s | awk '$1 == "120000" {print $4}'; git ls-files | grep -E '(^|/)(node_modules|\.worktrees)(/|$)' || true; } | sort -u)
          if [ -n "$bad" ]; then
            echo "These paths must not be committed:"
            echo "$bad"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --run

  typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reporting only for now. `vite build` strips types without checking them, and a plain
      # `tsc --noEmit` was unusable until the tsconfig overlap below was fixed, so errors have
      # accumulated unseen. Failing this job today would block every pull request; it exists to
      # make the count visible so it can be driven down, and should be made blocking at zero.
      - name: Typecheck
        continue-on-error: true
        run: npm run typecheck

  build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
